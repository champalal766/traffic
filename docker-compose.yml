services:
  mysql:
    image: mysql:8.4
    container_name: smart-traffic-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_traffic
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - smart-traffic-mysql-data:/var/lib/mysql

volumes:
  smart-traffic-mysql-data:
