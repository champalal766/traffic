spring.application.name=smart-traffic-management
server.port=8080

# MySQL database for persistent live traffic data.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_traffic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
